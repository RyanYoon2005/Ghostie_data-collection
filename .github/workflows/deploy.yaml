name: Deploy API

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests and generate report
        run: python -m pytest tests/ -v --html=tests/test-report.html --self-contained-html

      - name: Install Playwright and Chromium
        if: always()
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Convert test report to PDF
        if: always()
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import os
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('file://' + os.path.abspath('tests/test-report.html'))
              page.wait_for_load_state('networkidle')
              page.pdf(path='tests/test-report.pdf', format='A4', print_background=True)
              browser.close()
          "

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/test-report.pdf

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - uses: aws-actions/setup-sam@v2

      - run: sam build

      - run: sam deploy --stack-name Ghostie-data-collection --resolve-s3 --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
