name: Deploy API

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests and generate report
        run: python -m pytest tests/ -m unit --html=tests/unit-test-report.html --log-cli-level=INFO

      - name: Run integration tests and generate report
        run: python -m pytest tests/ -m integration --html=tests/integration-test-report.html --log-cli-level=INFO

      - name: Check combined coverage
        run: python -m pytest tests/ --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Install Playwright and Chromium
        if: always()
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Convert test reports to PDF
        if: always()
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import os
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for name in ['unit-test-report', 'integration-test-report']:
                  html_path = os.path.abspath(f'tests/{name}.html')
                  if not os.path.exists(html_path):
                      continue
                  page = browser.new_page()
                  page.goto('file://' + html_path)
                  page.wait_for_load_state('networkidle')
                  page.pdf(path=f'tests/{name}.pdf', format='A4', print_background=True)
              browser.close()
          "

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/unit-test-report.pdf

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: tests/integration-test-report.pdf

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - uses: aws-actions/setup-sam@v2

      - run: sam build

      - run: >
          sam deploy
          --stack-name Ghostie-data-collection
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-fail-on-empty-changeset
          --parameter-overrides
          NewsApiKey=${{ secrets.NEWSAPI_KEY }}
          SerpApiKey=${{ secrets.SERP_API_KEY }}
          FinnhubApiKey=${{ secrets.FINNHUB_API_KEY }}
          RetrievalApiBase=${{ secrets.RETRIEVAL_API_BASE }}
          CharlieApiUrl=${{ secrets.CHARLIE_API_URL }}
          CharlieApiEmail=${{ secrets.CHARLIE_API_EMAIL }}
          CharlieApiPassword=${{ secrets.CHARLIE_API_PASSWORD }}
          ScraperApiKey=${{ secrets.SCRAPER_API_KEY }}
